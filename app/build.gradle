plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.offlineai.app'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.offlineai.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.8.0'
        force 'androidx.core:core-ktx:1.8.0'
        force 'androidx.annotation:annotation:1.8.1'
        force 'androidx.annotation:annotation-jvm:1.8.1'
        force 'androidx.collection:collection:1.4.2'
        force 'androidx.collection:collection-jvm:1.4.2'
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.20'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
        force 'androidx.fragment:fragment:1.5.4'
        force 'androidx.fragment:fragment-ktx:1.5.4'
        force 'androidx.transition:transition:1.2.0'
        force 'androidx.lifecycle:lifecycle-runtime:2.5.1'
        force 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
        force 'com.google.errorprone:error_prone_annotations:2.30.0'
        force 'com.google.j2objc:j2objc-annotations:3.0.0'
        force 'org.checkerframework:checker-qual:3.43.0'
        force 'com.google.code.findbugs:jsr305:3.0.2'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.5.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
}
